<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四年级数学竖式互动练习</title>
  <style>
    :root {
      --blue: #1769aa;
      --blue-light: #eaf5ff;
      --green: #16834b;
      --green-light: #e9f8ef;
      --red: #c53737;
      --red-light: #fff0f0;
      --yellow: #fff8d8;
      --ink: #243342;
      --muted: #657585;
      --line: #d8e2eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #edf8ff 0%, #fff9e9 100%);
    }

    .page {
      width: min(1100px, calc(100% - 28px));
      margin: 24px auto 48px;
    }

    header {
      padding: 26px 28px;
      color: #fff;
      text-align: center;
      background: linear-gradient(120deg, #1769aa, #35a3d6);
      border-radius: 22px;
      box-shadow: 0 10px 25px rgba(23, 105, 170, .2);
    }

    h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 38px); }
    header p { margin: 0; font-size: 16px; }

    .student-info {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 20px 0;
      padding: 18px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(45, 80, 110, .09);
    }

    label { font-weight: 700; }

    .student-info input {
      width: 100%;
      margin-top: 7px;
      padding: 11px 12px;
      font: inherit;
      border: 2px solid var(--line);
      border-radius: 10px;
    }

    .instructions {
      margin-bottom: 20px;
      padding: 14px 18px;
      background: var(--yellow);
      border-left: 6px solid #f2b72c;
      border-radius: 12px;
      line-height: 1.7;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 30px 0 14px;
      font-size: 23px;
    }

    .badge {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      color: #fff;
      background: var(--blue);
      border-radius: 50%;
    }

    .questions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      padding: 17px 15px 15px;
      text-align: center;
      background: #fff;
      border: 2px solid transparent;
      border-radius: 16px;
      box-shadow: 0 5px 16px rgba(45, 80, 110, .08);
      transition: transform .15s, border-color .15s;
    }

    .card:focus-within { transform: translateY(-2px); border-color: #72b9e5; }
    .card.correct { border-color: var(--green); background: var(--green-light); }
    .card.wrong { border-color: var(--red); background: var(--red-light); }

    .number {
      position: absolute;
      top: 10px;
      left: 12px;
      color: var(--muted);
      font-weight: 800;
    }

    .vertical-sum {
      width: 132px;
      margin: 22px auto 16px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .top, .bottom {
      display: grid;
      grid-template-columns: 27px 1fr;
      text-align: right;
      white-space: pre;
    }

    .operator { text-align: left; }
    .rule { margin-top: 5px; border-top: 3px solid var(--ink); }

    .answer {
      width: 100%;
      padding: 10px 7px;
      text-align: center;
      font: 700 19px/1.2 Consolas, monospace;
      border: 2px solid var(--line);
      border-radius: 9px;
      outline: none;
    }

    .answer:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(23, 105, 170, .12); }
    .feedback { min-height: 24px; margin-top: 8px; font-size: 14px; font-weight: 700; }
    .correct .feedback { color: var(--green); }
    .wrong .feedback { color: var(--red); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 30px 0 18px;
    }

    button {
      padding: 12px 22px;
      font: 700 16px/1.2 inherit;
      cursor: pointer;
      border: 0;
      border-radius: 12px;
    }

    .primary { color: #fff; background: var(--blue); }
    .secondary { color: var(--blue); background: #fff; border: 2px solid var(--blue); }
    button:hover { filter: brightness(.96); }

    #result {
      display: none;
      margin: 18px auto;
      padding: 20px;
      text-align: center;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(45, 80, 110, .1);
    }

    #result.show { display: block; }
    #score { color: var(--blue); font-size: 34px; font-weight: 900; }
    #message { margin: 8px 0 0; font-size: 18px; }

    footer { margin-top: 28px; color: var(--muted); text-align: center; font-size: 13px; }

    @media (max-width: 850px) { .questions { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 470px) {
      .page { width: min(100% - 18px, 1100px); margin-top: 9px; }
      header { padding: 20px 14px; border-radius: 15px; }
      .student-info { grid-template-columns: 1fr; }
      .questions { gap: 10px; }
      .card { padding: 14px 9px 12px; }
      .vertical-sum { width: 112px; font-size: 23px; }
    }

    @media print {
      body { background: #fff; }
      .page { width: 100%; margin: 0; }
      header { color: #000; background: #fff; box-shadow: none; border: 2px solid #000; }
      .student-info, .card { box-shadow: none; }
      .questions { grid-template-columns: repeat(4, 1fr); }
      .actions, #result, footer { display: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>四年级数学竖式练习</h1>
      <p>加法 · 减法｜共20题</p>
    </header>

    <section class="student-info" aria-label="学生资料">
      <label>姓名<input id="studentName" type="text" placeholder="请输入姓名"></label>
      <label>班级<input id="studentClass" type="text" placeholder="请输入班级"></label>
    </section>

    <div class="instructions"><strong>作答说明：</strong>先在草稿纸上列竖式计算，再把最后答案填入方框。全部完成后，按“提交并批改”。</div>

    <div id="worksheet"></div>

    <div class="actions">
      <button class="primary" id="checkBtn" type="button">提交并批改</button>
      <button class="secondary" id="resetBtn" type="button">重新练习</button>
      <button class="secondary" type="button" onclick="window.print()">打印练习</button>
    </div>

    <section id="result" aria-live="polite">
      <div>你的成绩</div>
      <div id="score">0 / 20</div>
      <p id="message"></p>
    </section>

    <footer>认真计算，细心检查，你一定可以！</footer>
  </main>

  <script>
    const groups = [
      {
        title: '第一部分：加法', icon: '+',
        items: [
          [2468, 1357, '+'], [5824, 3069, '+'], [7436, 2589, '+'],
          [12675, 8346, '+'], [27408, 15637, '+'], [36954, 28076, '+'],
          [48579, 32746, '+'], [50638, 29457, '+'], [67284, 18569, '+'],
          [73846, 26175, '+']
        ]
      },
      {
        title: '第二部分：减法', icon: '−',
        items: [
          [6842, 2517, '−'], [9000, 4386, '−'], [12540, 6875, '−'],
          [30006, 14789, '−'], [52103, 26854, '−'], [70000, 35628, '−'],
          [86425, 47968, '−'], [60240, 28675, '−'], [91003, 54786, '−'],
          [100000, 65847, '−']
        ]
      }
    ];

    const worksheet = document.getElementById('worksheet');
    let questionNumber = 0;

    function getAnswer(a, b, op) {
      if (op === '+') return a + b;
      if (op === '−') return a - b;
      return a * b;
    }

    groups.forEach(group => {
      const heading = document.createElement('h2');
      heading.className = 'section-title';
      heading.innerHTML = `<span class="badge">${group.icon}</span>${group.title}`;
      worksheet.appendChild(heading);

      const grid = document.createElement('section');
      grid.className = 'questions';

      group.items.forEach(([a, b, op]) => {
        questionNumber += 1;
        const answer = getAnswer(a, b, op);
        const card = document.createElement('article');
        card.className = 'card';
        card.dataset.answer = answer;
        card.innerHTML = `
          <span class="number">${questionNumber}.</span>
          <div class="vertical-sum" aria-label="${a} ${op} ${b}">
            <div class="top"><span></span><span>${a}</span></div>
            <div class="bottom"><span class="operator">${op}</span><span>${b}</span></div>
            <div class="rule"></div>
          </div>
          <input class="answer" type="text" inputmode="numeric" pattern="[0-9]*"
                 aria-label="第${questionNumber}题答案" placeholder="填写答案" autocomplete="off">
          <div class="feedback"></div>`;
        grid.appendChild(card);
      });

      worksheet.appendChild(grid);
    });

    const cards = [...document.querySelectorAll('.card')];
    const inputs = [...document.querySelectorAll('.answer')];
    const result = document.getElementById('result');

    inputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/[^0-9]/g, '');
        const card = input.closest('.card');
        card.classList.remove('correct', 'wrong');
        card.querySelector('.feedback').textContent = '';
      });
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter' && inputs[index + 1]) inputs[index + 1].focus();
      });
    });

    document.getElementById('checkBtn').addEventListener('click', () => {
      let correct = 0;
      let firstIncomplete = null;

      cards.forEach(card => {
        const input = card.querySelector('.answer');
        const feedback = card.querySelector('.feedback');
        const expected = Number(card.dataset.answer);
        const supplied = input.value.trim();
        card.classList.remove('correct', 'wrong');

        if (supplied === '') {
          card.classList.add('wrong');
          feedback.textContent = '还没作答';
          if (!firstIncomplete) firstIncomplete = input;
        } else if (Number(supplied) === expected) {
          correct += 1;
          card.classList.add('correct');
          feedback.textContent = '✓ 正确';
        } else {
          card.classList.add('wrong');
          feedback.textContent = `✗ 正确答案：${expected}`;
        }
      });

      document.getElementById('score').textContent = `${correct} / ${cards.length}`;
      const percentage = correct / cards.length;
      document.getElementById('message').textContent =
        percentage === 1 ? '太棒了，全部答对！' :
        percentage >= .8 ? '做得很好，再检查一下错题吧！' :
        percentage >= .6 ? '不错，订正错题后会更进步！' :
        '别灰心，重新列竖式再算一次！';
      result.classList.add('show');
      result.scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (firstIncomplete) setTimeout(() => firstIncomplete.focus(), 500);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      inputs.forEach(input => { input.value = ''; });
      cards.forEach(card => {
        card.classList.remove('correct', 'wrong');
        card.querySelector('.feedback').textContent = '';
      });
      result.classList.remove('show');
      inputs[0].focus();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
