<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五年级数学单元一｜1 000 000以内的整数</title>
  <style>
    :root {
      --blue: #146fc1;
      --navy: #17324d;
      --pale: #eef6fc;
      --line: #c7d8e6;
      --green: #087d5f;
      --red: #bc3546;
      --yellow: #fff2b7;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--navy);
      background-color: #f4f8fc;
      background-image:
        linear-gradient(rgba(20,111,193,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20,111,193,.045) 1px, transparent 1px);
      background-size: 30px 30px;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 16px;
    }
    button, input { font: inherit; }
    .header {
      padding: 34px 20px;
      color: #fff;
      background: linear-gradient(120deg, #0d5c9f, #1e82d2);
      box-shadow: 0 10px 30px rgba(23,50,77,.18);
    }
    .header-inner { width: min(1000px, 100%); margin: auto; }
    .kicker { margin: 0 0 8px; font-weight: 800; letter-spacing: .12em; opacity: .9; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15; }
    .subtitle { margin: 10px 0 0; font-size: 1rem; line-height: 1.7; opacity: .92; }
    .layout {
      width: min(1000px, calc(100% - 28px));
      margin: 28px auto 60px;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    .side {
      position: sticky;
      top: 16px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(23,50,77,.09);
    }
    .progress-row { display: flex; justify-content: space-between; font-weight: 800; }
    .progress-row strong { color: var(--blue); }
    .track { height: 10px; margin: 12px 0 22px; overflow: hidden; border-radius: 99px; background: #dceaf5; }
    .bar { width: 0; height: 100%; background: var(--blue); transition: width .2s ease; }
    .side label { display: block; margin-bottom: 7px; font-size: .9rem; font-weight: 800; }
    .tip { margin: 12px 0 0; color: #657c90; font-size: .82rem; line-height: 1.55; }
    input[type="text"] {
      width: 100%;
      min-height: 46px;
      padding: 9px 12px;
      border: 1px solid #aebfcd;
      border-radius: 10px;
      color: var(--navy);
      background: #fff;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(20,111,193,.13); }
    .notice {
      display: none;
      margin-bottom: 18px;
      padding: 13px 16px;
      border: 1px solid #d9a62b;
      border-radius: 12px;
      color: #684a00;
      background: var(--yellow);
      font-weight: 800;
    }
    .result {
      display: none;
      margin-bottom: 24px;
      padding: 20px;
      border: 2px solid #e4bb3d;
      border-radius: 18px;
      background: linear-gradient(120deg, #fff8d7, #fff);
      box-shadow: 0 12px 26px rgba(90,70,0,.08);
    }
    .result strong { display: block; margin: 5px 0; font-size: 2rem; }
    .section { margin-bottom: 28px; }
    .section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .section-no {
      width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 13px 4px 13px 4px; color: #fff; background: var(--blue); font-weight: 900;
    }
    h2 { margin: 0; font-size: 1.3rem; }
    .section-head p { margin: 3px 0 0; color: #6b8193; font-size: .87rem; }
    .questions { display: grid; gap: 11px; }
    .question {
      position: relative;
      padding: 19px 20px 19px 65px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 6px 17px rgba(23,50,77,.055);
    }
    .question.correct { border-color: #6db99c; background: #f4fcf8; }
    .question.wrong { border-color: #e39aa4; background: #fff8fa; }
    .qno {
      position: absolute; top: 18px; left: 17px; width: 33px; height: 33px;
      display: grid; place-items: center; border-radius: 10px;
      color: var(--blue); background: #e6f2fb; font-weight: 900;
    }
    .question label { display: block; margin-bottom: 10px; font-weight: 800; line-height: 1.6; }
    .feedback { display: none; margin-top: 9px; font-size: .9rem; font-weight: 800; }
    .feedback.ok { color: var(--green); }
    .feedback.no { color: var(--red); }
    .actions { display: flex; justify-content: center; gap: 12px; margin-top: 30px; }
    button {
      min-height: 48px;
      padding: 10px 22px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: var(--blue);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(20,111,193,.2);
    }
    button.secondary { color: #145f9f; background: #fff; border: 1px solid #8fb2cf; box-shadow: none; }
    button:hover { filter: brightness(.96); }
    @media (max-width: 750px) {
      .layout { grid-template-columns: 1fr; }
      .side { position: static; }
    }
    @media (max-width: 500px) {
      .header { padding: 26px 16px; }
      .layout { width: min(100% - 20px, 1000px); margin-top: 18px; }
      .question { padding: 17px 14px 17px 56px; }
      .qno { left: 13px; width: 31px; height: 31px; }
      .actions { flex-direction: column; }
      button { width: 100%; }
    }
    @media print {
      body { background: #fff; }
      .header { padding: 15px 0; color: var(--navy); background: #fff; box-shadow: none; }
      .side, .notice, .result, .actions, .feedback { display: none !important; }
      .layout { width: 100%; display: block; margin: 0; }
      .question { break-inside: avoid; box-shadow: none; }
    }

    .bottom-score {
      margin: 28px 0 10px;
      padding: 24px 20px;
      text-align: center;
      border-radius: 18px;
      background: #f7f9fc;
      border: 2px solid #dfe6ef;
      display: block;
    }
    .bottom-score-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .bottom-score-value {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.2;
      margin: 6px 0;
    }
    .bottom-score-message {
      font-size: 15px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <p class="kicker">五年级数学 · 单元一</p>
      <h1>1 000 000以内的整数</h1>
      <p class="subtitle">完成20题，检查你是否掌握读写、数位、比较、数列和近似值。</p>
    </div>
  </header>

  <main class="layout">
    <aside class="side">
      <div class="progress-row"><span>作答进度</span><strong id="count">0 / 20</strong></div>
      <div class="track" aria-label="作答进度"><div class="bar" id="bar"></div></div>
      <label for="studentName">姓名（选填）</label>
      <input type="text" id="studentName" placeholder="输入姓名">
      <p class="tip">数字可用空格分组，例如：472 305。</p>
    </aside>

    <div>
      <div class="notice" id="notice" role="alert"></div>
      <div class="result" id="result" aria-live="polite"></div>
      <div id="quiz"></div>
      <div class="actions">
        <button type="button" id="submit">提交成绩并查看答案</button>
        <button type="button" id="reset" class="secondary">重新作答</button>
        <button type="button" class="secondary" onclick="window.print()">打印练习</button>
      </div>

      <!-- 学生交卷后，在页面底部再次清楚显示总分 -->
      <div class="bottom-score" id="bottomScore" aria-live="polite">
        <div class="bottom-score-title">📊 本次练习成绩</div>
        <div class="bottom-score-value" id="bottomScoreValue">-- / 20</div>
        <div class="bottom-score-message" id="bottomScoreMessage">完成练习并提交后，这里会显示你的总分。</div>
      </div>
    </div>
  </main>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxZT3LOj1-rVNGTxCZw7WCTkEXl7bQGZ38Dr3d3vnUVa3f6R1bW7bD8HEiOVvi4TurHLw/exec";

    const questions = [
      [1,"读写整数","把 472 305 写成文字。",["四十七万二千三百零五"],"四十七万二千三百零五","输入文字"],
      [2,"读写整数","把“六十八万零四十二”写成数字。",["680042"],"680 042","输入数字"],
      [3,"读写整数","把 905 018 写成文字。",["九十万五千零一十八","九十万五千零十八"],"九十万五千零一十八","输入文字"],
      [4,"读写整数","写出由7个十万、4个万、6个百和2个一组成的数。",["740602"],"740 602","输入数字"],
      [5,"数位与数值","在 683 451 中，数字8在什么数位？",["万位"],"万位","例如：千位"],
      [6,"数位与数值","在 294 716 中，数字9的数值是多少？",["90000"],"90 000","输入数值"],
      [7,"数位与数值","517 268 的十万位数字是多少？",["5"],"5","输入数字"],
      [8,"数位与数值","由3个十万、6个千、5个十和4个一组成的数是多少？",["306054"],"306 054","输入数字"],
      [9,"展开与组成","写出 821 409 的展开式。",["8000002000010004009"],"800 000 + 20 000 + 1 000 + 400 + 9","用 + 连接各数值"],
      [10,"展开与组成","600 000 + 70 000 + 5 000 + 80 + 3 = ______",["675083"],"675 083","输入答案"],
      [11,"比较与排列","398 765 □ 398 756（填 >、< 或 =）",[">"],">","填 >、< 或 ="],
      [12,"比较与排列","702 090 □ 720 009（填 >、< 或 =）",["<"],"<","填 >、< 或 ="],
      [13,"比较与排列","从小到大排列：450 210、405 120、451 020、415 200",["405120415200450210451020"],"405 120、415 200、450 210、451 020","依次输入，用逗号隔开"],
      [14,"比较与排列","从大到小排列：608 008、680 080、600 880、608 800",["680080608800608008600880"],"680 080、608 800、608 008、600 880","依次输入，用逗号隔开"],
      [15,"数列与近似值","235 000、245 000、255 000、265 000、______",["275000"],"275 000","输入下一个数"],
      [16,"数列与近似值","899 998、899 999、______、900 001",["900000"],"900 000","输入缺少的数"],
      [17,"数列与近似值","把 647 321 写成最接近的万位近似值。",["650000"],"650 000","输入近似值"],
      [18,"数列与近似值","把 294 650 写成最接近的千位近似值。",["295000"],"295 000","输入近似值"],
      [19,"挑战题","用0、2、4、5、7、9各一次，组成最大的六位数。",["975420"],"975 420","输入六位数"],
      [20,"挑战题","把 764 285 写成最接近的十万位近似值。",["800000"],"800 000","输入近似值"]
    ];

    const notes = {
      "读写整数":"正确读出和写出六位数",
      "数位与数值":"分清数字所在的数位及其数值",
      "展开与组成":"理解一个数由哪些数值组成",
      "比较与排列":"先比较最高数位，再逐位比较",
      "数列与近似值":"找规律，并掌握四舍五入",
      "挑战题":"综合运用本单元知识"
    };

    const normalize = value => value.trim()
      .replace(/[０-９]/g, d => String(d.charCodeAt(0) - 65296))
      .replace(/＋/g, "+").replace(/＞/g, ">").replace(/＜/g, "<")
      .replace(/[\s,，、+＋。．.：“”"']/g, "");

    const correct = q => {
      const value = document.getElementById("a" + q[0]).value;
      return q[3].some(answer => normalize(answer) === normalize(value));
    };

    const sections = [...new Set(questions.map(q => q[1]))];
    document.getElementById("quiz").innerHTML = sections.map((section, index) => `
      <section class="section">
        <div class="section-head">
          <div class="section-no">${String(index + 1).padStart(2,"0")}</div>
          <div><h2>${section}</h2><p>${notes[section]}</p></div>
        </div>
        <div class="questions">
          ${questions.filter(q => q[1] === section).map(q => `
            <article class="question" id="q${q[0]}">
              <div class="qno">${q[0]}</div>
              <label for="a${q[0]}">${q[2]}</label>
              <input type="text" id="a${q[0]}" data-answer placeholder="${q[5]}" autocomplete="off">
              <div class="feedback" id="f${q[0]}"></div>
            </article>`).join("")}
        </div>
      </section>`).join("");

    function updateProgress() {
      const done = [...document.querySelectorAll("[data-answer]")].filter(input => input.value.trim()).length;
      document.getElementById("count").textContent = done + " / 20";
      document.getElementById("bar").style.width = (done / 20 * 100) + "%";
      document.getElementById("notice").style.display = "none";
    }

    document.querySelectorAll("[data-answer]").forEach(input => input.addEventListener("input", updateProgress));

    document.getElementById("submit").addEventListener("click", async () => {
      const button = document.getElementById("submit");
      const inputs = [...document.querySelectorAll("[data-answer]")];
      const done = inputs.filter(input => input.value.trim()).length;
      const notice = document.getElementById("notice");

      if (done < 20) {
        notice.textContent = `还有 ${20 - done} 题未作答。请完成后再提交。`;
        notice.style.display = "block";
        window.scrollTo({top: 0, behavior: "smooth"});
        return;
      }

      button.disabled = true;
      button.textContent = "正在批改并提交…";

      let score = 0;
      questions.forEach(q => {
        const ok = correct(q);
        if (ok) score++;

        const card = document.getElementById("q" + q[0]);
        const feedback = document.getElementById("f" + q[0]);

        card.classList.add(ok ? "correct" : "wrong");
        feedback.className = "feedback " + (ok ? "ok" : "no");

        // 所有题目都显示正确答案，让学生交卷后可以直接查看答案。
        feedback.textContent = ok
          ? "✓ 答对了｜答案：" + q[4]
          : "✗ 答错了｜正确答案：" + q[4];

        feedback.style.display = "block";
        document.getElementById("a" + q[0]).disabled = true;
      });

      const name = document.getElementById("studentName").value.trim();
      const message = score === 20
        ? "太棒了，全部答对！"
        : score >= 16
          ? "做得很好，再检查几题就更棒了！"
          : score >= 12
            ? "不错，请订正错题后再试一次。"
            : "继续加油，先看正确答案，再练习一次。";

      const result = document.getElementById("result");
      result.innerHTML =
        `<span>${name ? name + "，你的成绩是" : "你的成绩是"}</span>` +
        `<strong>${score} / 20</strong>` +
        `<span>${message}</span>`;
      result.style.display = "block";

      // 页面底部同时显示学生自己的总分。
      document.getElementById("bottomScoreValue").textContent = `${score} / ${questions.length}`;
      document.getElementById("bottomScoreMessage").textContent =
        `${name ? name + "，" : ""}你本次答对 ${score} 题，共 ${questions.length} 题。${message}`;

      document.getElementById("studentName").disabled = true;

      // 自动提交到老师的 Google Sheet，不需要学生填写 Email。
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {"Content-Type": "text/plain;charset=utf-8"},
          body: JSON.stringify({
            name: name || "未填写",
            score,
            total: questions.length,
            percentage: Math.round(score / questions.length * 100),
            completedAt: new Date().toLocaleString("zh-CN"),
            unit: "五年级数学单元一｜1 000 000以内的整数"
          })
        });

        notice.textContent = "✓ 成绩已自动提交给老师！下面可以查看每一题的正确答案。";
        notice.style.display = "block";
        button.textContent = "✓ 已提交成绩｜查看答案如下";
      } catch (error) {
        notice.textContent = "成绩批改完成，但提交到老师那里时遇到网络问题，请检查网络后重新提交。";
        notice.style.display = "block";
        button.disabled = false;
        button.textContent = "重新提交成绩并查看答案";
      }

      window.scrollTo({top: 0, behavior: "smooth"});
    });

    document.getElementById("reset").addEventListener("click", () => {
      document.querySelectorAll("[data-answer]").forEach(input => { input.value = ""; input.disabled = false; });
      document.querySelectorAll(".question").forEach(card => card.classList.remove("correct", "wrong"));
      document.querySelectorAll(".feedback").forEach(item => { item.style.display = "none"; item.textContent = ""; });
      document.getElementById("studentName").disabled = false;
      document.getElementById("result").style.display = "none";
      document.getElementById("bottomScoreValue").textContent = "-- / 20";
      document.getElementById("bottomScoreMessage").textContent = "完成练习并提交后，这里会显示你的总分。";
      const submitButton = document.getElementById("submit");
      submitButton.disabled = false;
      submitButton.textContent = "提交成绩并查看答案";
      document.getElementById("notice").style.display = "none";
      updateProgress();
      window.scrollTo({top: 0, behavior: "smooth"});
    });
  </script>
</body>
</html>
