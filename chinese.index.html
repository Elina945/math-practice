<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>五年级关联词互动练习</title>
  <style>
    :root{--ink:#23334d;--blue:#2d64d8;--cream:#f6f1e7;--paper:#fffdf8;--green:#24865f;--red:#ca3e53}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:radial-gradient(circle at 10% 10%,#ffd76670,transparent 23rem),radial-gradient(circle at 90% 85%,#63c7b450,transparent 25rem),var(--cream)}
    main{min-height:100vh;display:grid;place-items:center;padding:clamp(12px,3vw,36px)}
    .grid{width:min(1100px,100%);display:grid;grid-template-columns:minmax(260px,.7fr) minmax(0,1.3fr);gap:22px}.panel{background:#fffdf8f5;border:1px solid #23334d1f;box-shadow:0 24px 70px #363d4a1e}.intro{padding:34px;border-radius:34px 18px 18px 34px}.quiz{padding:clamp(22px,4vw,42px);border-radius:18px 34px 34px 18px}.head{display:flex;align-items:center;gap:15px}.icon{width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:var(--blue);color:#fff;font-size:28px;box-shadow:5px 6px #ffd25f}.eyebrow{margin:0 0 4px;color:#be4155;font-size:13px;font-weight:800;letter-spacing:.08em}h1{margin:0;font-size:clamp(32px,5vw,52px);line-height:1}.intro>p{color:#626c7c;line-height:1.85;margin:30px 0 20px}.tags{display:flex;gap:8px;flex-wrap:wrap}.tags span{padding:7px 12px;border-radius:999px;background:#edf3ff;color:#345179;font-size:13px;font-weight:700}.tags span:nth-child(2n){background:#fff0bf;color:#765700}.tip{margin-top:28px;padding:15px;border:1px dashed #d9a91c;border-radius:16px;background:#fff9df;color:#735817;line-height:1.6}.top{display:flex;justify-content:space-between;color:#6c778a;font-size:13px;font-weight:700}.bar{height:9px;margin:9px 0 30px;border-radius:99px;background:#e1e7f2;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2d64d8,#45aa9f);transition:width .25s}.meta{display:flex;align-items:center;gap:10px;color:#778196;font-size:14px}.kind{padding:7px 10px;border-radius:9px;background:#ffe18a;color:#664800;font-size:12px;font-weight:800}.quiz h2{font-size:clamp(20px,3vw,29px);line-height:1.65;margin:16px 0 22px}.answers{display:grid;gap:11px}.answer{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 15px;border:1.5px solid #dfe3eb;border-radius:16px;background:#fff;color:#354158;text-align:left;font-size:16px;cursor:pointer}.answer:hover{border-color:#83a3e6}.answer.selected{border-color:var(--blue);background:#f3f7ff}.answer.correct{border-color:#34a879;background:#ecfaf4;color:#176344}.answer.wrong{border-color:#dc6475;background:#fff1f3;color:#952b3b}.letter{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:#eef2f8;font-size:12px;font-weight:900}.mark{font-size:21px}.feedback{margin-top:14px;padding:15px 17px;border-radius:15px;line-height:1.6}.feedback.good{border-left:5px solid #34a879;background:#eaf8f1}.feedback.bad{border-left:5px solid #dc6475;background:#fff0f2}.feedback p{margin:6px 0 0;color:#536074;font-size:14px}.actions{display:flex;justify-content:flex-end;margin-top:20px}.primary{min-height:46px;min-width:145px;padding:11px 22px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px #2d64d838}.primary:disabled{opacity:.42;cursor:not-allowed}.result{display:none;width:min(560px,100%);padding:48px;border-radius:34px;text-align:center;background:var(--paper);box-shadow:0 24px 70px #363d4a25}.result h1{font-size:38px;margin:10px 0 18px}.score{width:150px;height:150px;margin:0 auto 20px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(#34a879 var(--deg),#e7e8e4 0);position:relative}.score:before{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--paper)}.score b{position:relative;color:var(--blue);font-size:38px}.result p{color:#5f6a7c;line-height:1.7}
    @media(max-width:800px){.grid{grid-template-columns:1fr}.intro,.quiz{border-radius:24px}.intro{padding:24px}.tip{display:none}}@media(max-width:500px){main{padding:8px}.intro,.quiz{padding:18px}.quiz h2{font-size:19px}.answer{font-size:14px}.primary{width:100%}}
  </style>
</head>
<body>
<main>
  <div class="grid" id="game">
    <section class="panel intro">
      <div class="head"><div class="icon">📖</div><div><p class="eyebrow">五年级语文 · 互动练习</p><h1>关联词闯关</h1></div></div>
      <p>读懂前后分句的关系，再选出最合适的关联词。每题作答后都会看到解析。</p>
      <div class="tags"><span>因果</span><span>转折</span><span>递进</span><span>条件</span><span>假设</span><span>并列</span></div>
      <div class="tip"><strong>✨ 答题小秘诀</strong><br>先读完整句子，再想一想：前后两部分是什么关系？</div>
    </section>
    <section class="panel quiz">
      <div class="top"><span id="count"></span><span id="scoreTop"></span></div><div class="bar"><i id="bar"></i></div>
      <div class="meta"><span class="kind" id="kind"></span><span id="instruction"></span></div>
      <h2 id="sentence"></h2><div class="answers" id="answers"></div><div id="feedback"></div>
      <div class="actions"><button class="primary" id="action" disabled>检查答案</button></div>
    </section>
  </div>
  <section class="result" id="result"><div style="font-size:48px">✨</div><p class="eyebrow">练习完成</p><h1 id="resultTitle"></h1><div class="score" id="scoreRing"><b id="percent"></b></div><p id="message"></p><button class="primary" id="restart">再挑战一次</button></section>
</main>
<script>
const Q=[
["转折关系","选择最恰当的关联词。","____ 天气十分炎热，____ 同学们仍然坚持完成体能训练。",["因为……所以……","虽然……但是……","只要……就……","不但……而且……"],1,"前后意思相反：天气炎热是困难，同学们仍坚持训练，所以用“虽然……但是……”。"],
["因果关系","选择最恰当的关联词。","____ 小华每天认真练习书法，____ 他的字越写越漂亮。",["因为……所以……","即使……也……","不是……而是……","一边……一边……"],0,"认真练习是原因，字越写越漂亮是结果，所以用“因为……所以……”。"],
["递进关系","选择能使句意更完整的一组关联词。","这本故事书____ 内容有趣，____ 插图也十分精美。",["不是……就是……","不但……而且……","如果……就……","虽然……但是……"],1,"后半句在前半句的基础上更进一步，因此用“不但……而且……”。"],
["条件关系","哪一组关联词最合适？","____ 我们平时多阅读、多积累，写作文时____ 会有丰富的材料。",["只要……就……","因为……所以……","既然……就……","宁可……也不……"],0,"“多阅读、多积累”是达成结果的条件，所以用“只要……就……”。"],
["假设关系","选择最恰当的关联词。","____ 明天下雨，运动会____ 延期举行。",["不但……而且……","如果……就……","一边……一边……","既……又……"],1,"明天下雨是假设的情况，延期是可能出现的结果，所以用“如果……就……”。"],
["并列关系","选择最恰当的关联词。","妹妹____ 唱歌，____ 跟着音乐轻轻摆动身体。",["一边……一边……","要么……要么……","与其……不如……","即使……也……"],0,"唱歌和摆动身体同时进行，所以用“一边……一边……”。"],
["选择关系","填入正确的关联词。","周末我们____ 去图书馆，____ 去科学馆，大家一起商量吧！",["不是……而是……","要么……要么……","因为……所以……","无论……都……"],1,"图书馆和科学馆是两个可选择的地点，所以用“要么……要么……”。"],
["转折关系","判断哪一句使用正确。","下面哪一句的关联词使用正确？",["因为雨下得很大，但是比赛继续进行。","虽然雨下得很大，但是比赛继续进行。","只要雨下得很大，所以比赛继续进行。","不但雨下得很大，就比赛继续进行。"],1,"“雨下得很大”与“比赛继续进行”形成转折，应用“虽然……但是……”。"],
["取舍关系","选择表达坚定选择的一组关联词。","小明____ 少玩一会儿游戏，____ 要先完成今天的功课。",["宁可……也……","与其……不如……","即使……也……","不但……而且……"],0,"句子表达宁愿放弃玩游戏，也要完成学习任务，属于取舍关系。"],
["条件关系","选择最恰当的关联词。","____ 遇到什么困难，我们____ 不应该轻易放弃。",["只有……才……","无论……都……","既然……就……","不是……而是……"],1,"不论出现哪一种困难，结果都不改变，所以用“无论……都……”。"],
["辨析改错","找出修改后最通顺的一句。","原句：小丽不但会弹钢琴，但是会拉小提琴。",["小丽因为会弹钢琴，所以会拉小提琴。","小丽不但会弹钢琴，而且会拉小提琴。","小丽虽然会弹钢琴，就会拉小提琴。","小丽只要会弹钢琴，也会拉小提琴。"],1,"“不但”必须和“而且”搭配，表示能力从弹钢琴递进到拉小提琴。"],
["综合运用","根据句意选择最佳答案。","我们____ 掌握了正确的方法，____ 能把这道难题解开。",["只有……才……","虽然……但是……","一边……一边……","不是……就是……"],0,"“掌握正确的方法”是解开难题的必要条件，因此用“只有……才……”。"]];
let n=0,score=0,chosen=null,checked=false;const $=id=>document.getElementById(id);
function draw(){const q=Q[n];$("count").textContent=`第 ${n+1} 题 / 共 ${Q.length} 题`;$("scoreTop").textContent=`得分 ${score}`;$("bar").style.width=`${n/Q.length*100}%`;$("kind").textContent=q[0];$("instruction").textContent=q[1];$("sentence").textContent=q[2];$("feedback").innerHTML="";$("action").textContent="检查答案";$("action").disabled=true;chosen=null;checked=false;$("answers").innerHTML=q[3].map((x,i)=>`<button class="answer" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${x}</span><span class="mark"></span></button>`).join("");document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>{if(checked)return;document.querySelectorAll(".answer").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");chosen=+b.dataset.i;$("action").disabled=false})}
$("action").onclick=()=>{const q=Q[n];if(!checked){checked=true;const ok=chosen===q[4];if(ok)score++;document.querySelectorAll(".answer").forEach((b,i)=>{if(i===q[4]){b.classList.add("correct");b.querySelector(".mark").textContent="✓"}else if(i===chosen){b.classList.add("wrong");b.querySelector(".mark").textContent="✕"}});$("feedback").innerHTML=`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'✓ 答对了！':'✕ 这题答错了'}</strong><p>${q[5]}</p></div>`;$("action").textContent=n===Q.length-1?"查看成绩":"下一题 →";$("scoreTop").textContent=`得分 ${score}`}else{n++;if(n<Q.length)draw();else finish()}};
function finish(){const p=Math.round(score/Q.length*100);$("game").style.display="none";$("result").style.display="block";$("resultTitle").textContent=`${score} / ${Q.length} 题答对`;$("percent").textContent=p+"%";$("scoreRing").style.setProperty("--deg",p*3.6+"deg");$("message").textContent=p===100?"太棒了！你已经是关联词小达人！":p>=75?"表现很好！再复习错题就更稳了。":p>=50?"基础不错，看看解析再挑战一次吧！":"别灰心，读懂前后句的关系就会越来越好！"}
$("restart").onclick=()=>{n=0;score=0;$("game").style.display="grid";$("result").style.display="none";draw()};draw();
</script>
</body>
</html>
